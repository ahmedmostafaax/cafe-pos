<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>页面未找到 · Cafe POS</title>
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      color: #faf6ee;
      background: #1a1410;
      background-image:
        radial-gradient(ellipse at 28% 68%, rgba(200,84,44,.22) 0, transparent 55%),
        radial-gradient(ellipse at 82% 22%, rgba(63,74,48,.18) 0, transparent 52%);
      display: flex; align-items: center; justify-content: center;
      padding: 32px; -webkit-font-smoothing: antialiased;
      position: relative; overflow: hidden;
    }
    body::before, body::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); border-radius: 50%;
      pointer-events: none;
    }
    body::before { width: 600px; height: 600px; border: 1px solid rgba(200,84,44,.06); }
    body::after  { width: 380px; height: 380px; border: 1px solid rgba(200,84,44,.10); }

    .wrap { position: relative; z-index: 1; text-align: center; max-width: 520px; }
    .brand {
      font-family: 'Fraunces', 'Noto Serif SC', Georgia, serif;
      font-style: italic; font-size: 24px; font-weight: 600;
      color: #e07548; letter-spacing: .3px; margin-bottom: 48px;
    }
    .code {
      font-family: 'Fraunces', 'Noto Serif SC', Georgia, serif;
      font-size: clamp(96px, 18vw, 160px); font-weight: 700;
      line-height: 1; letter-spacing: -4px; color: #c8542c;
      margin-bottom: 16px;
    }
    .title {
      font-family: 'Fraunces', 'Noto Serif SC', Georgia, serif;
      font-size: 28px; font-weight: 600; color: #faf6ee;
      margin-bottom: 12px;
    }
    .sub {
      font-size: 14px; line-height: 1.8;
      color: rgba(250,246,238,.6); margin-bottom: 36px;
    }
    .btn {
      display: inline-block; padding: 12px 28px;
      background: #c8542c; color: #fff; text-decoration: none;
      font-size: 13px; font-weight: 700; letter-spacing: 1px;
      border-radius: 6px; transition: background .15s;
    }
    .btn:hover { background: #e07548; }
    .foot {
      margin-top: 48px; font-size: 11px; letter-spacing: .5px;
      color: rgba(250,246,238,.35);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Cafe POS · <em>Demo</em></div>
    <div class="code">404</div>
    <div class="title">这道菜不在菜单上</div>
    <div class="sub">您访问的页面已下架或地址有误，<br/>请返回首页继续浏览。</div>
    <a href="/" class="btn">返回首页</a>
    <div class="foot">XIAOBAI SHAN · TRATTORIA</div>
  </div>
</body>
</html>
