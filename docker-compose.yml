services:
  cafe-pos-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-pos-demo
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DB_PATH: /app/data
      FRONTEND_DIST: /app/cafe-pos-demo/dist
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
